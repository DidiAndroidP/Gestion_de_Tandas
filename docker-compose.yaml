services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=tandas_db
      - JWT_SECRET=tu_secreto_super_seguro
    depends_on:
      - db
    networks:
      - tandas-network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tandas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/infrastructure/db/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - tandas-network

volumes:
  mysql_data:

networks:
  tandas-network:
    driver: bridge