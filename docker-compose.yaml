services:
  app:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tandas-network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/infrastructure/db/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - tandas-network
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p${DB_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  tandas-network:
    driver: bridge